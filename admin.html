<!doctype html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>PolosJ2 Admin</title><style>body{font-family:Arial;background:#090909;color:#fff;padding:20px}.box{max-width:1000px;margin:auto;background:#151515;padding:20px;border-radius:16px;margin-bottom:16px}input,button{padding:12px;border-radius:10px;border:1px solid #444;background:#111;color:#fff}button{background:#fff;color:#000;font-weight:bold}table{width:100%;border-collapse:collapse}td,th{padding:9px;border-bottom:1px solid #333;text-align:left}.ok{color:#5fda91}.muted{color:#999}.hide{display:none}</style></head><body><div class="box" id="login"><h2>PolosJ2 · Administración</h2><p class="muted">Acceso: polosj204@gmail.com</p><input id="pass" type="password" placeholder="Contraseña"><button onclick="login()">Entrar</button><p id="err"></p></div><div id="app" class="hide"><div class="box"><button onclick="load()">Actualizar</button> <button onclick="location.reload()">Cerrar sesión</button></div><div class="box"><h2>Pedidos</h2><div id="orders">Cargando...</div></div><div class="box"><h2>Códigos de segunda compra</h2><div id="codes">Cargando...</div></div></div><script>
const U="https://wkvzclqemzzjlskmdeaw.supabase.co",K="sb_publishable_wRlaMcAjW9XYVupTbt3eZA_15W9XvVt";let T="";
async function api(p,o={}){o.headers={...(o.headers||{}),apikey:K,Authorization:"Bearer "+T,"Content-Type":"application/json"};let r=await fetch(U+p,o),d=await r.json();if(!r.ok)throw Error(d.message||d.error_description||"Error");return d}
async function login(){let r=await fetch(U+"/auth/v1/token?grant_type=password",{method:"POST",headers:{apikey:K,"Content-Type":"application/json"},body:JSON.stringify({email:"polosj204@gmail.com",password:document.getElementById("pass").value})});let d=await r.json();if(!r.ok){document.getElementById("err").textContent=d.error_description||"Credenciales incorrectas";return}T=d.access_token;document.getElementById("login").classList.add("hide");document.getElementById("app").classList.remove("hide");load()}
async function load(){try{let o=await api("/rest/v1/orders?select=*&order=created_at.desc"),c=await api("/rest/v1/customers?select=id,name,phone,city"),cm={};c.forEach(x=>cm[x.id]=x);document.getElementById("orders").innerHTML=o.length?'<table><tr><th>Cliente</th><th>Total</th><th>Estado</th><th></th></tr>'+o.map(x=>{let z=cm[x.customer_id]||{};return '<tr><td>'+z.name+'<br>'+z.phone+'</td><td>$'+Number(x.total).toLocaleString('es-CO')+'</td><td>'+x.status+'</td><td>'+(x.status==='delivered'?'<span class="ok">Entregado</span>':'<button onclick="deliver(\''+x.id+'\')">Marcar entregado</button>')+'</td></tr>'}).join('')+'</table>':'Sin pedidos';let d=await api("/rest/v1/discounts?select=code,discount_percent,active,used_at,expires_at,customer_id&order=created_at.desc");document.getElementById("codes").innerHTML=d.length?'<table><tr><th>Código</th><th>Descuento</th><th>Estado</th></tr>'+d.map(x=>'<tr><td><b>'+x.code+'</b></td><td>'+x.discount_percent+'%</td><td>'+(x.used_at?'Usado':'<span class="ok">Activo</span>')+'</td></tr>').join('')+'</table>':'Sin códigos'}catch(e){document.getElementById("orders").textContent=e.message}}
async function deliver(id){if(!confirm("¿Marcar como entregado? Se generará el código de segunda compra si corresponde."))return;await api("/rest/v1/orders?id=eq."+id,{method:"PATCH",headers:{Prefer:"return=minimal"},body:JSON.stringify({status:"delivered",delivered_at:new Date().toISOString()})});load()}
</script></body></html>
